[package]
name = "vibecoded_game"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.14", default-features = false, features = [
    "animation",
    "bevy_asset",
    "bevy_audio",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "vorbis",
    "bevy_winit",
    "png",
    "x11",
    "wayland"
] }
noise = "0.8"
bevy_egui = { version = "0.28", features = ["render"] }
bevy_rapier2d = { version = "0.27", features = ["simd-stable", "debug-render-2d"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
